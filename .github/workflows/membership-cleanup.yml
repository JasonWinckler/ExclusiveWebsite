name: Membership production data cleanup

on:
  push:
    tags: ['exclusive-cleanup-inspect-*']
  workflow_dispatch:
    inputs:
      expected_commit:
        description: 'Exact full commit SHA for read-only inventory'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: exclusive-membership-production
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate exact requested revision
        id: request
        env:
          INPUT_COMMIT: ${{ inputs.expected_commit }}
        shell: bash
        run: |
          set -euo pipefail
          expected="${INPUT_COMMIT:-}"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            expected="${GITHUB_REF#refs/tags/exclusive-cleanup-inspect-}"
            [[ "$expected" == "$GITHUB_SHA" ]]
          fi
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$expected" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.request.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cloudflare/pnpm-lock.yaml
      - name: Install pinned backend dependencies
        run: pnpm --dir cloudflare install --frozen-lockfile
      - name: Read-only inventory of existing production D1
        env:
          CI: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLEANUP_OPERATION: inspect
          EXPECTED_COMMIT: ${{ steps.request.outputs.commit }}
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/prod-cleanup.mjs
