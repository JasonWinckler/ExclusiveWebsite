name: Inspect or retry the reviewed membership Worker build
on:
  push:
    tags: ['exclusive-build-inspect-*', 'exclusive-build-retry-*']
permissions:
  contents: read
concurrency:
  group: exclusive-membership-production
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Inspect exact failed build; retry only on explicit retry tag
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/membership-build-recovery.mjs
