<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2a0207" />
    <meta name="description" content="Jason Shadow — official music, social and project links." data-meta-description />
    <title>Jason Shadow | Official Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/exclusive.css" />
  </head>
  <body>
    <div class="ember-field" aria-hidden="true"></div>
    <main class="page-shell">
      <section class="profile-card">
        <div class="banner-wrap" aria-hidden="true">
          <img class="banner" src="uploads/banner.png" width="1536" height="652" alt="" decoding="async" />
          <div class="banner-overlay"></div>
        </div>
        <div class="profile-content">
          <img class="avatar" src="uploads/profile.png" width="1536" height="1536" alt="Jason Shadow" decoding="async" />
          <div class="language-switcher" aria-label="Language selector"><button class="language-button" type="button" data-lang="de">DE</button><button class="language-button" type="button" data-lang="en">EN</button></div>
          <p class="eyebrow" data-linktree-i18n="eyebrow">Official links</p>
          <h1>Jason Shadow</h1>
          <p class="tagline" data-linktree-i18n="tagline">Music, projects and official updates — all in one place.</p>
          <p class="ai-disclosure" data-linktree-i18n="aiNotice">The profile image was digitally enhanced in part using AI technology.</p>
          <nav class="link-list" aria-label="Official links">
            <a class="link-button" href="https://www.instagram.com/shadows.temptation_official/" target="_blank" rel="noopener noreferrer">
              <span class="icon" aria-hidden="true">◎</span>
              <span><strong>Instagram</strong><small>@shadows.temptation_official</small></span>
            </a>
            <a class="link-button exclusive" href="https://exclusive.jason-shadow.com/" target="_blank" rel="noopener noreferrer">
              <span class="icon" aria-hidden="true">🔞</span>
              <span><strong data-linktree-i18n="exclusive">Exclusive Content 🔞</strong><small data-linktree-i18n="openSite">Open website</small></span>
            </a>
          </nav>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
