<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2a0207" />
    <meta name="description" content="Jason Shadow — local membership entry page without external adult-platform links." data-i18n-attr="content:metaDescription" />
    <title data-i18n="metaTitle">Jason Shadow | Secure 18+ Membership</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/exclusive.css" />
  </head>
  <body>
    <div class="ember-field" aria-hidden="true"></div>
    <main class="page-shell">
      <section class="profile-card" data-animate="rise">
        <div class="banner-wrap">
          <img class="banner" src="uploads/banner.png" width="1536" height="652" alt="Jason Shadow promotional banner" fetchpriority="high" decoding="async" />
          <div class="banner-overlay"></div>
        </div>
        <div class="profile-content">
          <img class="avatar" src="uploads/profile.png" width="1536" height="1536" alt="Jason Shadow promotional portrait" decoding="async" />
          <div class="language-switcher" aria-label="Language selector"><button class="language-button" type="button" data-lang="de">DE</button><button class="language-button" type="button" data-lang="en">EN</button></div>
          <p class="eyebrow" data-i18n="adultsOnly">Adults only · 18+</p>
          <h1 data-i18n="linktreeTitle">Exclusive Content</h1>
          <p class="tagline" data-i18n="linktreeText">All membership information now lives on one page. There is no redirect to external adult platforms or external payment widgets.</p>
          <p class="ai-disclosure" data-i18n="aiNotice">This promotional image was digitally enhanced in part using AI technology.</p>
          <nav class="link-list link-list--single" aria-label="Exclusive Content link">
            <a class="link-button exclusive" href="../#exclusive">
              <span class="icon" aria-hidden="true">🔒</span>
              <span>
                <strong data-i18n="exclusiveHeading">Exclusive Content</strong>
                <small data-i18n="openSite">Open Website</small>
              </span>
            </a>
          </nav>
        </div>
      </section>
    </main>
    <script src="../assets/js/translations.js"></script>
    <script src="script.js"></script>
  </body>
</html>
